services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      USERNAME: "Administrator"
      PASSWORD: "123"
      RAM_SIZE: "16G"
      CPU_CORES: "8"
      DISK_SIZE: "670G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "0.0.0.0:8006:8006"
      - "0.0.0.0:3389:3389/tcp"
      - "0.0.0.0:3389:3389/udp"
    stop_grace_period: 2m